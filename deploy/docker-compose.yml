# =============================================================================
# Ch10 §1.4 + §1.5 — Full local production stack via Docker Compose
#
# This Compose file brings up the complete architecture from Ch10 Figure 10.1:
#
#  ┌─ API Gateway (Kong/Istio — represented by the api service here) ─────────┐
#  │  api (FastAPI, :8000)                                                     │
#  └──────────────────────────────────────────────────────────────────────────┘
#          │ dispatches to
#  ┌─ Task Queue ─────────────────────────────────────────────────────────────┐
#  │  redis (broker + result backend, :6379)                                  │
#  └──────────────────────────────────────────────────────────────────────────┘
#          │ consumed by
#  ┌─ Worker Pool ────────────────────────────────────────────────────────────┐
#  │  worker (Celery, autoscaling via K8s HPA in production)                  │
#  └──────────────────────────────────────────────────────────────────────────┘
#          │ calls
#  ┌─ External Services ──────────────────────────────────────────────────────┐
#  │  qdrant (Vector DB, :6333/:6334)                                         │
#  └──────────────────────────────────────────────────────────────────────────┘
#  ┌─ Observability Stack (Ch10 §1.4) ────────────────────────────────────────┐
#  │  prometheus (:9090) — scrapes /metrics from api                          │
#  │  grafana (:3000)    — dashboards over prometheus                         │
#  │  otel-collector     — OTLP receiver → Jaeger exporter                    │
#  │  jaeger (:16686)    — distributed trace UI                               │
#  └──────────────────────────────────────────────────────────────────────────┘
#
# Start:   docker compose -f deploy/docker-compose.yml up
# Stop:    docker compose -f deploy/docker-compose.yml down
# =============================================================================

version: "3.9"

# Shared environment — injected into api and worker.
# In production these come from K8s Secrets / Vault sidecar (Ch10 §1.1).
x-common-env: &common-env
  ENV: development
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  # LLM — set in your shell or .env file; never hardcode here.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HF_TOKEN: ${HF_TOKEN:-}
  GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  # Vector store
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: blog-mas-knowledge
  BLUEPRINT_COLLECTION: blog-mas-blueprints
  # Task queue (Ch10 §1.3)
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  RESULT_BACKEND_URL: redis://redis:6379/1
  RESULT_TTL_SECONDS: "86400"
  WORKER_CONCURRENCY: "4"
  # Token budget (Ch10 §2.1)
  SUMMARIZER_TRIGGER_TOKENS: "4000"
  MAX_INPUT_TOKENS: "32000"
  # Security
  API_KEY: ${API_KEY:-dev-local-key-change-me}
  API_PREFLIGHT_MODERATION: "true"
  # Tracing (Ch10 §1.4) — enabled in this compose stack
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: blog-mas
  # Trace persistence
  TRACE_STORE_DIR: /app/data/traces

services:

  # ─── Qdrant: Vector Database ────────────────────────────────────────────────
  # Ch10: "It calls the LLM API for planning and generation, and the Vector DB
  # for retrieving semantic blueprints and knowledge."
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis: Message Broker + Result Backend ──────────────────────────────────
  # Ch10 §1.3: "Redis Queue (RQ): a simpler alternative"
  # Used here as both the Celery broker AND the result store.
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Service: FastAPI Orchestration Layer ────────────────────────────────
  # Ch10 §1.2: "This is the control deck, a high-performance, asynchronous
  # layer that validates the request structure."
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: blog-mas-api:latest
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    volumes:
      - trace_data:/app/data/traces
      - audit_data:/app/data/audit
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ─── Worker: Celery Engine Room ──────────────────────────────────────────────
  # Ch10 §1.3: "This is the engine room, an autoscaling group of containers,
  # each running the hardened glass-box Context Engine logic."
  # In production, the K8s HPA replaces the 'replicas: 2' here.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: blog-mas-worker:latest
    deploy:
      replicas: 2   # K8s HPA takes over this in production (see k8s/hpa-worker.yaml)
    environment:
      <<: *common-env
    volumes:
      - trace_data:/app/data/traces
      - audit_data:/app/data/audit
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ─── Prometheus: Metrics Collection ─────────────────────────────────────────
  # Ch10 §1.4: "Prometheus acts as an open source monitoring system and
  # time-series database, scraping data from the application's /metrics endpoint."
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Grafana: Dashboards and Alerting ───────────────────────────────────────
  # Ch10 §1.4: "Grafana provides the visualization layer, presenting live
  # dashboards and configurable alerting rules."
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── OpenTelemetry Collector: Tracing Pipeline ──────────────────────────────
  # Ch10 §1.4: "Distributed tracing tools such as Jaeger or Zipkin make these
  # flows visible end to end."
  # The collector receives OTLP from the app and forwards to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector's own metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  # ─── Jaeger: Distributed Trace UI ───────────────────────────────────────────
  # Ch10 §1.4: tracing "exposes bottlenecks and highlights where latency is
  # introduced across the distributed workflow."
  jaeger:
    image: jaegertracing/all-in-one:1.63
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC span receiver (from otel-collector)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
  trace_data:
  audit_data:
