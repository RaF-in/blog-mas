# =============================================================================
# Ch10 §1.1 / §1.6 — Kubernetes Secret (sensitive credentials)
#
# Ch10:
#   "Storing sensitive information directly in environment variables on the
#    host machine or within basic Kubernetes Secrets is often insufficient
#    for enterprise-grade security.  Centralised secrets management systems
#    are required."
#
# PRODUCTION NOTE:
# ─────────────────────────────────────────────────────────────────────────────
# Do NOT store plaintext secrets in this file in production.
# The values below are BASE64-ENCODED PLACEHOLDERS only.
#
# In a real enterprise cluster, use one of these patterns instead:
#
# Option A — ExternalSecrets Operator (recommended):
#   Replace this Secret with an ExternalSecret resource that pulls values
#   from AWS Secrets Manager / HashiCorp Vault at runtime:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: blog-mas-secrets
#     namespace: blog-mas-prod
#   spec:
#     secretStoreRef:
#       name: vault-store
#       kind: ClusterSecretStore
#     target:
#       name: blog-mas-secrets
#     data:
#       - secretKey: OPENAI_API_KEY
#         remoteRef:
#           key: blog-mas/prod
#           property: OPENAI_API_KEY
#
# Option B — Vault Agent Sidecar / CSI Driver:
#   An init-container fetches secrets from Vault and writes them to
#   /var/run/secrets/blog-mas/ — the FileBackend in secrets.py reads them.
#
# Option C — AWS Secrets Manager CSI provider:
#   The SecretProviderClass mounts AWS secrets as files into the pod.
# ─────────────────────────────────────────────────────────────────────────────
#
# For local development without a secrets manager, run:
#   kubectl create secret generic blog-mas-secrets \
#     --namespace blog-mas-prod \
#     --from-literal=OPENAI_API_KEY="sk-..." \
#     --from-literal=HF_TOKEN="hf_..." \
#     --from-literal=API_KEY="your-api-key" \
#     --from-literal=WEBHOOK_SECRET="your-webhook-secret"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: blog-mas-secrets
  namespace: blog-mas-prod
  labels:
    app.kubernetes.io/name: blog-mas
    app.kubernetes.io/component: secrets
  annotations:
    # In production replace with ExternalSecret — see note above.
    secrets-manager: "placeholder-use-external-secrets-in-production"
type: Opaque
data:
  # Values are base64-encoded PLACEHOLDERS — replace before applying.
  # echo -n "your-value" | base64
  OPENAI_API_KEY: UkVQTEFDRV9NRQ==   # "REPLACE_ME"
  HF_TOKEN: UkVQTEFDRV9NRQ==
  API_KEY: UkVQTEFDRV9NRQ==
  WEBHOOK_SECRET: UkVQTEFDRV9NRQ==
