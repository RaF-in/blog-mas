[project]
name = "blog-mas"
version = "0.1.0"
description = "Multi-agent blog generation system using LangGraph"
readme = "README.md"
authors = [
    { name = "Rafin Neaz", email = "neazrafin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-huggingface>=1.2.2",
    "langgraph>=0.4.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "tiktoken>=0.7.0",
    "structlog>=25.0.0",
    "langchain-openai>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

# ── Chapter 10 production dependencies ────────────────────────────────────────
# Install with:  uv sync --group prod
# Kept as a separate group so the development environment stays lean.
prod = [
    # Ch10 §1.2 — FastAPI orchestration layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Ch10 §1.3 — Celery async task queue + Redis broker/result-backend
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Ch10 §1.4 — Prometheus metrics
    "prometheus-client>=0.21.0",

    # Ch10 §1.4 — Distributed tracing (OpenTelemetry → OTLP → Jaeger)
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.scripts]
blog-mas = "blog_mas.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
