[project]
name = "blog-mas"
version = "0.1.0"
description = "Multi-agent blog generation system using LangGraph"
readme = "README.md"
authors = [
    { name = "Rafin Neaz", email = "neazrafin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-huggingface>=1.2.2",
    "langgraph>=0.4.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "tiktoken>=0.7.0",
    "structlog>=25.0.0",
    "langchain-openai>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[project.scripts]
blog-mas = "blog_mas.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
