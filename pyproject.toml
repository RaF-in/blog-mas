[project]
name = "blog-mas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafin Neaz", email = "neazrafin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-huggingface>=1.2.2",
    "langgraph>=0.4.0",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
blog-mas = "blog_mas:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
